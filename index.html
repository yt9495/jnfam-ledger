<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JNFAM 수불부 관리 시스템</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#f4f6fa; --card:#fff; --line:#e3e8f0; --txt:#1e2532; --sub:#6b7688;
  --blue:#2563eb; --blue-l:#eff4ff; --green:#059669; --green-l:#ecfdf5;
  --amber:#d97706; --amber-l:#fffbeb; --red:#dc2626; --red-l:#fef2f2;
  --purple:#7c3aed; --purple-l:#f5f3ff;
}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI','Malgun Gothic',sans-serif}
body{background:var(--bg);color:var(--txt);font-size:14px}
.layout{display:flex;min-height:100vh}
.sidebar{width:220px;background:#101827;color:#cbd5e1;padding:20px 0;flex-shrink:0;position:sticky;top:0;height:100vh}
.sidebar .logo{padding:0 20px 18px;border-bottom:1px solid #2a3548;margin-bottom:12px}
.sidebar .logo b{color:#fff;font-size:17px;display:block}
.sidebar .logo span{font-size:11px;color:#7d8aa0}
.nav-item{display:flex;align-items:center;gap:10px;padding:11px 20px;cursor:pointer;font-size:14px;border-left:3px solid transparent}
.nav-item:hover{background:#1a2438;color:#fff}
.nav-item.active{background:#1e2a44;color:#fff;border-left-color:var(--blue)}
.nav-item .badge{margin-left:auto;background:var(--amber);color:#fff;font-size:11px;border-radius:10px;padding:1px 7px}
.conn{margin:14px 20px 0;padding:8px 10px;border-radius:8px;font-size:12px;background:#1a2438}
.conn .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.conn a{color:#93c5fd;text-decoration:none;font-size:11px}
.conn a:hover{text-decoration:underline}
.login-gate{position:fixed;inset:0;z-index:9999;background:#101827;display:flex;align-items:center;justify-content:center;padding:20px}
.login-card{background:var(--card);border-radius:14px;padding:36px 34px;width:100%;max-width:400px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.login-card .lg-logo{font-size:22px;font-weight:700;color:var(--txt)}
.login-card .lg-sub{font-size:12px;color:var(--sub);margin-top:4px;letter-spacing:.4px}
.login-card .lg-desc{font-size:13px;color:var(--sub);margin:22px 0 20px;line-height:1.6}
.login-card .lg-btn{width:100%;justify-content:center;padding:11px 16px;font-size:14px}
.login-card .lg-msg{margin-top:16px;font-size:13px;color:var(--red);line-height:1.6;display:none}
.login-card .lg-msg.on{display:block}
.login-card .lg-alt{margin-top:14px;font-size:12px;display:none}
.login-card .lg-alt.on{display:inline-flex}
.main{flex:1;padding:24px 28px;max-width:1560px}
h2.page-title{font-size:20px;margin-bottom:4px}
.page-sub{color:var(--sub);font-size:13px;margin-bottom:16px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-bottom:20px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.kpi .k-label{font-size:12px;color:var(--sub);margin-bottom:6px}
.kpi .k-value{font-size:23px;font-weight:800;letter-spacing:-.5px}
.kpi .k-sub{font-size:12px;color:var(--sub);margin-top:4px}
.kpi.b-blue{border-top:3px solid var(--blue)} .kpi.b-amber{border-top:3px solid var(--amber)}
.kpi.b-green{border-top:3px solid var(--green)} .kpi.b-purple{border-top:3px solid var(--purple)}
.kpi.b-red{border-top:3px solid var(--red)}
.qty-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:20px}
.kpi.qty{border-top:3px solid var(--green)}
.kpi.qty .k-label{font-size:13px;font-weight:700;color:var(--txt)}
.kpi.qty .k-value{font-size:26px;color:var(--green)} .kpi.qty .k-value small{font-size:14px;font-weight:600;color:var(--sub);margin-left:3px}
.kpi.qty .k-row{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);margin-top:5px}
.kpi.qty .k-row b{color:var(--txt);font-weight:600}
.kpi.qty.neg .k-value{color:var(--red)}
.amt-section{margin-top:8px;padding-top:18px;border-top:1px dashed var(--line)}
.amt-section > h3{font-size:14px;color:var(--sub);margin:0 0 12px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:20px}
.panel h3{font-size:15px;margin-bottom:12px}
.grid2{display:grid;grid-template-columns:1.2fr 1fr;gap:20px}
@media(max-width:1100px){.grid2{grid-template-columns:1fr}}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:#f8fafc;color:var(--sub);font-weight:600;text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid #f0f2f6;white-space:nowrap}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.tag{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11.5px;font-weight:600}
.tag.goods{background:var(--green-l);color:var(--green)}
.tag.transit{background:var(--amber-l);color:var(--amber)}
.tag.planned{background:#f1f5f9;color:#64748b}
.tag.filled{background:var(--purple-l);color:var(--purple)}
.tag.ok{background:var(--green-l);color:var(--green)}
.tag.warn{background:var(--red-l);color:var(--red)}
.btn{display:inline-flex;align-items:center;gap:6px;border:none;border-radius:8px;padding:8px 14px;font-size:13px;cursor:pointer;font-weight:600}
.btn.primary{background:var(--blue);color:#fff} .btn.primary:hover{background:#1d4ed8}
.btn.green{background:var(--green);color:#fff}
.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--txt)}
.btn.sm{padding:4px 10px;font-size:12px;border-radius:6px}
.btn.danger{background:var(--red-l);color:var(--red)}
.btn.toggle{background:#f1f5f9;color:var(--sub);border:1px solid var(--line)}
.btn.toggle.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.toolbar .spacer{flex:1}
select,input[type=text],input[type=number],input[type=date],textarea{
  border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;background:#fff;color:var(--txt);width:100%}
select:focus,input:focus,textarea:focus{outline:2px solid #bfd3ff;border-color:var(--blue)}
.filter-sel{width:auto}
.toolbar input.search{width:220px}
.toolbar input[type=date]{width:140px}
.filter-sum{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--sub);margin:-4px 0 12px 2px}
.filter-sum b{color:var(--txt)}
.period-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:16px}
.period-bar b{font-size:13px}
.period-bar input[type=date]{width:150px}
.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.5);display:none;align-items:flex-start;justify-content:center;z-index:50;overflow-y:auto;padding:40px 16px}
.modal-bg.open{display:flex}
.modal{background:#fff;border-radius:14px;width:720px;max-width:100%;padding:22px}
.modal h3{font-size:16px;margin-bottom:16px}
.form-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.form-grid .full{grid-column:1/-1}
.fld label{display:block;font-size:12px;color:var(--sub);margin-bottom:4px;font-weight:600}
.code-preview{background:var(--blue-l);border:1px dashed var(--blue);border-radius:8px;padding:10px 12px;font-family:Consolas,monospace;font-size:13px;color:var(--blue);font-weight:700}
.code-preview.transit{background:var(--amber-l);border-color:var(--amber);color:var(--amber)}
.calc-box{background:#f8fafc;border-radius:8px;padding:10px 12px;font-size:13px;display:flex;gap:18px;flex-wrap:wrap}
.calc-box b{font-variant-numeric:tabular-nums}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.item-card{border:1px solid var(--line);border-radius:10px;padding:14px}
.item-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.item-card .ic-title{font-weight:700;font-size:14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.item-card .row{display:flex;justify-content:space-between;font-size:12.5px;padding:3px 0}
.item-card .row .v{font-weight:600;font-variant-numeric:tabular-nums}
.chart-wrap{height:300px}
.empty{color:var(--sub);text-align:center;padding:30px;font-size:13px}
.banner{background:var(--amber-l);border:1px solid #fcd34d;border-radius:10px;padding:12px 16px;margin-bottom:16px;font-size:13px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tbl-scroll{overflow-x:auto}
.upcoming-scroll{max-height:420px;overflow-y:auto}
.upcoming-scroll thead th{position:sticky;top:0;background:var(--card);z-index:1}
.toast{position:fixed;bottom:24px;right:24px;background:#101827;color:#fff;padding:12px 18px;border-radius:10px;font-size:13px;z-index:100;display:none}
.help{font-size:12px;color:var(--sub);line-height:1.7}
/* 변경 이력 */
.hist-panel{padding:14px 18px}
.hist-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.hist-head h3{margin:0}
.hist-list{list-style:none;margin:0;padding:0}
.hist-list li{display:grid;grid-template-columns:118px 150px 108px 1fr;gap:10px;align-items:center;padding:7px 2px;border-top:1px solid var(--line);font-size:13px}
.hist-list li:first-child{border-top:none}
.hist-time{color:var(--sub);font-size:12px;white-space:nowrap}
.hist-user{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hist-sum{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hist-sum .chg{color:var(--sub);font-size:12px;margin-left:6px}
@media(max-width:900px){.hist-list li{grid-template-columns:1fr 1fr}.hist-sum{grid-column:1/-1;white-space:normal}}
.tag.h-add{background:#dbeafe;color:#1d4ed8}
.tag.h-upd{background:#f1f5f9;color:#475569}
.tag.h-del{background:var(--red-l);color:var(--red)}
.tag.h-cv{background:var(--green-l);color:var(--green)}
.tag.h-cfg{background:var(--purple-l);color:var(--purple)}
.hist-detail{background:#f8fafc;font-size:12px;color:var(--sub)}
.hist-detail td{padding:8px 14px}
.hist-detail .d-row{display:inline-block;margin:2px 14px 2px 0}
.hist-detail .d-row b{color:var(--txt)}
.hist-detail del{color:var(--red)} .hist-detail ins{color:var(--green);text-decoration:none;font-weight:600}
tr.hist-row{cursor:pointer} tr.hist-row:hover td{background:#f8fafc}
.help code{background:#f1f5f9;padding:1px 5px;border-radius:4px;font-size:11.5px}
.mono{font-family:Consolas,monospace;font-size:12px}
.days-late{color:var(--red);font-weight:700} .days-soon{color:var(--amber);font-weight:700}
/* ===== Inventory Ledger (엑셀 원본 양식) ===== */
.ledger-tbl{border:2px solid #d33;font-size:12.5px}
.ledger-tbl th{background:#f3f4f6;color:#374151;border:1px solid #cdd3dd;text-align:center;padding:7px 8px}
.ledger-tbl td{border:1px solid #dde2ea;padding:6px 9px}
.ledger-tbl .grp-HF{background:#eaf3e2} .ledger-tbl .grp-HNO3{background:#fbe3f0}
.ledger-tbl .grp-HCl{background:#e3ecf7} .ledger-tbl .grp-H2SO4{background:#fdeadd}
.ledger-tbl td.center{text-align:center;vertical-align:middle}
.ledger-tbl tr.total-row td{background:#ffff00;font-weight:800;border-top:2px solid #d33;font-size:13px}
.ledger-tbl td.neg{color:var(--red)}
.ledger-title{text-align:center;font-size:17px;font-weight:800;margin-bottom:2px}
.ledger-ref{text-align:center;font-size:11.5px;color:var(--red);margin-bottom:12px}
</style>
</head>
<body>
<div class="layout">
  <nav class="sidebar">
    <div class="logo"><b>JNFAM 수불부</b><span>Inventory Ledger System · 2026</span></div>
    <div class="nav-item active" data-view="dashboard">📊 대시보드</div>
    <div class="nav-item" data-view="inbound">📥 상품입고</div>
    <div class="nav-item" data-view="outbound">📤 상품출고</div>
    <div class="nav-item" data-view="transit">🚢 미착품 관리 <span class="badge" id="transitBadge" style="display:none"></span></div>
    <div class="nav-item" data-view="ledger">📒 수불부</div>
    <div class="nav-item" data-view="history">🕘 변경 이력</div>
    <div class="nav-item" data-view="settings">⚙️ 설정</div>
    <div class="conn" id="connStatus"><span class="dot" style="background:#94a3b8"></span>로컬 모드</div>
  </nav>
  <main class="main" id="main"></main>
</div>
<div class="login-gate" id="loginGate" style="display:none">
  <div class="login-card">
    <div class="lg-logo">JNFAM 수불부</div>
    <div class="lg-sub">Inventory Ledger System</div>
    <div class="lg-desc">허용된 Google 계정으로 로그인해야<br>수불부 데이터를 볼 수 있습니다.</div>
    <button class="btn primary lg-btn" onclick="app.googleLogin()">Google 계정으로 로그인</button>
    <div class="lg-msg" id="loginMsg"></div>
    <button class="btn ghost lg-alt" id="loginAlt" onclick="app.logout()">다른 계정으로 로그인</button>
  </div>
</div>
<div class="modal-bg" id="modalBg"><div class="modal" id="modalBox"></div></div>
<div class="toast" id="toast"></div>

function localLoad(){
  const raw = localStorage.getItem(LSKEY);
  if(raw){ try{ const d=JSON.parse(raw); Object.assign(state,{inbound:d.inbound||[],outbound:d.outbound||[],beginning:d.beginning||[],master:d.master||SEED.master,checks:d.checks||{}}); return true; }catch(e){} }

}

  localStorage.setItem(LSKEY, JSON.stringify({inbound:state.inbound,outbound:state.outbound,beginning:state.beginning,master:state.master,checks:state.checks||{}}));
}
const HISTKEY='jnfam_ledger_history';
function localHistLoad(){ try{ state.history=JSON.parse(localStorage.getItem(HISTKEY)||'[]'); }catch(e){ state.history=[]; } }
function uid(p){ return p + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }

async function dbAdd(col, obj, action){
  if(!obj.id) obj.id = uid(col.slice(0,2));
  if(fb){ await fb.setDoc(fb.doc(fb.db,col,obj.id), obj); }
  else { state[col].push(obj); localSave(); render(); }
  logHistory({action:action||(COL_LABEL[col]+' 등록'), kind:'add', col, docId:obj.id, rec:obj});
}
async function dbUpdate(col, id, patch, action){
  const before = state[col].find(x=>x.id===id); const snap = before? {...before} : null;
  if(fb){ await fb.setDoc(fb.doc(fb.db,col,id), patch, {merge:true}); }
  else { const r=state[col].find(x=>x.id===id); if(r) Object.assign(r,patch); localSave(); render(); }
  const changes = diffFields(col, snap||{}, patch);
  const kind = /전환|선적/.test(action||'') ? 'cv' : 'upd';
  if(changes.length || kind==='cv') logHistory({action:action||(COL_LABEL[col]+' 수정'), kind, col, docId:id, rec:{...(snap||{}),...patch}, changes});
}
async function dbDelete(col, id, action){
  const before = state[col].find(x=>x.id===id); const snap = before? {...before} : {id};
  if(fb){ await fb.deleteDoc(fb.doc(fb.db,col,id)); }
  else { state[col]=state[col].filter(x=>x.id!==id); localSave(); render(); }
  logHistory({action:action||(COL_LABEL[col]+' 삭제'), kind:'del', col, docId:id, rec:snap});
}

/* ================= 변경 이력 (history 컬렉션, 추가 전용) ================= */
const COL_LABEL = {inbound:'입고', outbound:'출고', config:'설정'};
const FIELD_LABEL = {
  invType:'재고구분', item:'품목', purity:'함량', supplier:'구매처', pack:'용기', etd:'ETD', eta:'ETA', plantEta:'창고입고일',
  bl:'BL', invoice:'INVOICE', qty:'수량', price:'단가', amount:'금액', freight:'해상운송료', cc:'통관비', duty:'관세',
  trucking:'운송비', etc:'기타비용', note:'비고', manager:'담당', category:'구분', buyer:'판매처', date:'출고일', shuttle:'Shuttle'
};
function diffFields(col, before, patch){
  const out=[];
  Object.keys(patch).forEach(k=>{
    if(k==='id'||k==='inCode') return;
    const a=before[k], b=patch[k];
    if((a!==null&&typeof a==='object')||(b!==null&&typeof b==='object')) return;
    const na=(a==null?'':a), nb=(b==null?'':b);
    if(typeof na==='number'||typeof nb==='number'){ if((+na||0)===(+nb||0)) return; }
    else if(String(na)===String(nb)) return;
    out.push({f:k, label:FIELD_LABEL[k]||k, from:fmtVal(k,a), to:fmtVal(k,b)});
  });
  return out;
}
function fmtVal(k,v){
  if(v==null||v==='') return '(빈값)';
  if(k==='purity') return pct(v);
  if(typeof v==='number') return (['qty'].includes(k)? fmt(v) : fmt2(v));
  return String(v);
}
function recSummary(col, r){
  if(!r) return '';
  if(col==='inbound') return `${inCode(r)} · ${fmt(r.qty)} kg${r.invoice?' · '+String(r.invoice).trim():''}`;
  if(col==='outbound') return `${r.category==='충전'?'충전 ':''}${r.item||''} ${r.purity!=null?pct(r.purity):''} → ${r.buyer||''} · ${fmt(r.qty)} kg · ${r.date||''}`;
  return '';
}
async function logHistory({action, kind, col, docId, rec, changes, summary}){
  try{
    const now=new Date();
    const h={ id:uid('h'), tsMs:now.getTime(), ts:now.toISOString(),
      user: currentUser? (currentUser.email||'') : '로컬 사용자',
      userName: currentUser? (currentUser.displayName||'') : '',
      action, kind:kind||'upd', col:col||'', docId:docId||'',
      summary: summary || recSummary(col, rec),
      changes: (changes||[]).slice(0,40) };
    if(fb){ await fb.setDoc(fb.doc(fb.db,'history',h.id), h); }
    else { state.history.unshift(h); state.history=state.history.slice(0,1000); try{ localStorage.setItem(HISTKEY, JSON.stringify(state.history)); }catch(e){} render(); }
  }catch(e){ console.warn('이력 기록 실패', e); }
}
const userShort = h => (h.userName || (h.user||'').split('@')[0] || '-');
function relTime(ms){
  const d=(Date.now()-ms)/1000;
  if(d<60) return '방금 전';
  if(d<3600) return Math.floor(d/60)+'분 전';
  if(d<86400) return Math.floor(d/3600)+'시간 전';
  if(d<86400*7) return Math.floor(d/86400)+'일 전';
  return new Date(ms).toLocaleDateString('ko-KR');
}
const absTime = ms => { const d=new Date(ms); const z=n=>String(n).padStart(2,'0'); return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())} ${z(d.getHours())}:${z(d.getMinutes())}`; };
const histTag = h => `<span class="tag h-${h.kind||'upd'}">${esc(h.action)}</span>`;
const chgText = (h,n) => { const c=h.changes||[]; if(!c.length) return ''; const s=c.slice(0,n).map(x=>`${x.label} ${x.from}→${x.to}`).join(', '); return s+(c.length>n?` 외 ${c.length-n}건`:''); };
async function saveConfigDoc(){
  if(fb){ await fb.setDoc(fb.doc(fb.db,'config','app'), {beginning:state.beginning, master:state.master}, {merge:true}); }
  else { localSave(); render(); }
}

/* ================= Firebase + Google 로그인 ================= */
const FB_URL='https://www.gstatic.com/firebasejs/10.12.2/';
let AUM=null, auth=null, currentUser=null, unsubs=[];

function setConn(kind, text, extra){
  const el=document.getElementById('connStatus'); if(!el) return;
  const C={ok:'#22c55e',wait:'#f59e0b',off:'#94a3b8',err:'#ef4444'};
  el.innerHTML='<span class="dot" style="background:'+(C[kind]||'#94a3b8')+'"></span>'+text+(extra||'');
}
function showLogin(msg){
  const g=document.getElementById('loginGate'); if(!g) return;
  g.style.display='flex';
  const m=document.getElementById('loginMsg'), a=document.getElementById('loginAlt');
  if(msg){ m.textContent=msg; m.classList.add('on'); a.classList.add('on'); }
  else { m.textContent=''; m.classList.remove('on'); a.classList.remove('on'); }
}
function hideLogin(){ const g=document.getElementById('loginGate'); if(g) g.style.display='none'; }

async function googleLogin(){
  if(!auth){ toast('Firebase가 초기화되지 않았습니다'); return; }
  try{
    const provider=new AUM.GoogleAuthProvider();
    provider.setCustomParameters({prompt:'select_account'});
    await AUM.signInWithPopup(auth, provider);
  }catch(e){
    if(e.code==='auth/popup-closed-by-user'||e.code==='auth/cancelled-popup-request') return;
    showLogin('로그인 실패: '+(e.code||e.message));
  }
}
async function logout(){ if(auth){ try{ await AUM.signOut(auth); }catch(e){} } }

function stopListeners(){
  unsubs.forEach(u=>{ try{ u(); }catch(e){} });
  unsubs=[]; fb=null;
}

function startListeners(fsM, db, cfg){
  stopListeners();
  fb={ db, doc:fsM.doc, setDoc:fsM.setDoc, deleteField:fsM.deleteField, deleteDoc:fsM.deleteDoc, collection:fsM.collection, writeBatch:fsM.writeBatch, getDocs:fsM.getDocs };
  state.history=[]; state.historyErr='';
  const pending=new Set(['inbound','outbound','config']);
  const arrived=k=>{
    pending.delete(k);
    if(pending.size===0){
      setConn('ok','Firebase 연결됨<br><span style="opacity:.75">'+(currentUser?currentUser.email:(cfg.projectId||''))+'</span>',
        '<div style="margin-top:6px"><a href="#" onclick="app.logout();return false">로그아웃</a></div>');
    }
  };
  const onErr=err=>{
    stopListeners();
    if(err.code==='permission-denied'){
      setConn('err','접근 권한 없음');
      showLogin('이 계정'+(currentUser?'('+currentUser.email+')':'')+'은 접근 권한이 없습니다.\n관리자에게 계정 등록을 요청하세요.');
    }else{
      setConn('err','Firestore 오류: '+err.code);
      toast('Firestore 오류: '+err.code);
    }
  };
  setConn('wait','데이터 불러오는 중…');
  ['inbound','outbound'].forEach(col=>{
    unsubs.push(fsM.onSnapshot(fsM.collection(db,col), snap=>{
      state[col]=snap.docs.map(d=>({id:d.id,...d.data()}));
      arrived(col); render();
    }, onErr));
  });
  unsubs.push(fsM.onSnapshot(fsM.doc(db,'config','app'), d=>{
    if(d.exists()){ const c=d.data(); if(c.beginning) state.beginning=c.beginning; if(c.master) state.master=c.master; state.checks=c.checks||{}; }
    arrived('config'); render();
  }, onErr));
  /* 변경 이력: 최근 500건 실시간 구독 — 실패해도 본 데이터 연결에는 영향 없음 */
  unsubs.push(fsM.onSnapshot(fsM.query(fsM.collection(db,'history'), fsM.orderBy('tsMs','desc'), fsM.limit(500)), snap=>{
    state.history=snap.docs.map(d=>({id:d.id,...d.data()})); state.historyErr=''; render();
  }, err=>{
    state.historyErr = err.code==='permission-denied'

async function connectFirebase(cfg, silent){
  try{
    const [appM, fsM, auM] = await Promise.all([
      import(FB_URL+'firebase-app.js'),
      import(FB_URL+'firebase-firestore.js'),
      import(FB_URL+'firebase-auth.js')
    ]);
    const app=appM.initializeApp(cfg);
    const db =fsM.getFirestore(app);
    AUM=auM; auth=auM.getAuth(app);
    localStorage.setItem(CFGKEY, JSON.stringify(cfg));
    return await new Promise(resolve=>{
      let settled=false;
      auM.onAuthStateChanged(auth, user=>{
        currentUser=user;
        if(user){
          hideLogin();
          startListeners(fsM, db, cfg);
          if(!silent) toast('로그인: '+user.email);
        }else{
          stopListeners();
          state.inbound=[]; state.outbound=[]; state.history=[];
          setConn('off','로그인 필요');
          showLogin(''); render();
        }
        if(!settled){ settled=true; resolve(true); }

    toast('Firebase 연결 실패: '+e.message);
    console.error(e);
    return false;
  }

async function seedToFirebase(){

  let batch=fb.writeBatch(fb.db), n=0;
  const push=(col,obj)=>{ batch.set(fb.doc(fb.db,col,obj.id),obj); if(++n>=400){ batch.commit(); batch=fb.writeBatch(fb.db); n=0; } };
  SEED.inbound.forEach(r=>push('inbound',{...r}));

/* ================= 코드 & 계산 ================= */
const PREFIX = {'상품':'04','미착품':'05','선적예정(미인식)':'00'};
const pct = p => (Number(p)*100).toFixed(2)+'%';
const abbr = item => { const m=(state.master||SEED.master).items.find(i=>i.name===item); return m?m.abbr:item; };
const supShort = s => s==='JNF CO.,LTD.' ? 'JNF' : (s||'').replace(/[^A-Za-z0-9]/g,'').slice(0,8);
const inCode  = r => (PREFIX[r.invType]||'04') + abbr(r.item) + r.pack + supShort(r.supplier) + pct(r.purity);
const outCode = r => '04' + r.item + r.pack + (r.buyer||'') + pct(r.purity);
const capCost = r => (+r.freight||0)+(+r.cc||0)+(+r.duty||0);   // 총계(자본화) = 해상운송료+통관비+관세 (엑셀 R열)
const cogc = r => (+r.amount||0) + capCost(r);                  // 원재료인식금액 = 금액+총계 (엑셀 Q열)
const fmt = n => (n==null||isNaN(n)) ? '-' : Number(n).toLocaleString('en-US',{maximumFractionDigits:0});
const fmt2 = n => (n==null||isNaN(n)) ? '-' : Number(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const money = n => (n<0?'-$':'$') + fmt2(Math.abs(n));
const today = () => new Date().toISOString().slice(0,10);
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dstr = v => (typeof v==='string') ? v : '';   // 날짜 안전 변환 (숫자·null 방어)
const effInDate = r => dstr(r.plantEta) || dstr(r.eta) || dstr(r.etd) || '';
/* 인식 시점: 상품=창고입고일, 미착품=FOB 선적일(ETD) */
const effRecDate = r => r.invType==='미착품' ? (dstr(r.etd) || dstr(r.eta) || '') : effInDate(r);

function itemGroups(){
  const set=new Map();
  (state.master||SEED.master).items.forEach(it=>it.purities.forEach(p=>set.set(it.name+'|'+p,{item:it.name,purity:p})));
  [...state.inbound,...state.outbound,...state.beginning].forEach(r=>{ if(r.item&&r.purity!=null) set.set(r.item+'|'+r.purity,{item:r.item,purity:r.purity}); });
  return [...set.entries()].map(([key,v])=>({key,...v,label:v.item+' '+pct(v.purity)}));
}
/* ================= 재고 평가 (회계 기준) =================
   ▸ 분류는 '조회 기준일' 시점으로 판단 (현재 재고구분과 무관)
       미착품 = ETD(FOB 선적) ≤ 기준일 < 창고입고일      상품 = 창고입고일 ≤ 기준일
   ▸ 상품(04): 총평균법 — 단가 = (기초금액 + 입고금액) ÷ (기초수량 + 입고수량), 출고원가·기말 = 수량 × 단가
       평균 방식: 'period' = 조회 구간 총평균 (회계 검토안) / 'monthly' = 월별 총평균 (월말 이월)
   ▸ 미착품(05): 건별 원가 (선적 시 인식 → 창고입고 시 상품으로 대체)
   ▸ 원가 기준: 구매단가만 / 운임·통관·관세 포함 / 운송비·기타까지 포함(회계 기준, 판매운송비는 입력 제외) */
const BOOK_START = '2026-01-01';   // 기초재고(설정) 기준일 = 2025-12-31 마감 재고
const BASES = {
  full:   {label:'운송비·기타 포함 (회계 기준)', amt:'원재료인식금액', desc:'입고원가 = 금액 + 해상운송료 + 통관비 + 관세 + 입고 운송비(내륙) + 입고 관련 기타비용 · 판매운송비는 입고 운송비에 넣지 않습니다', f:r=>cogc(r)+(+r.trucking||0)+(+r.etc||0)},
  landed: {label:'운임·통관비·관세 포함', amt:'금액+운임·통관·관세', desc:'입고원가 = 금액 + 해상운송료 + 통관비 + 관세', f:r=>cogc(r)},
  price:  {label:'구매단가만 (인보이스)', amt:'구매금액', desc:'입고원가 = 단가 × 수량 (인보이스 금액)', f:r=>+r.amount||0}
};
const AVGS = {
  period:  {label:'구간 총평균', desc:'조회 구간 전체를 하나의 평균단가로 계산 (기초 + 구간 입고) — 회계 검토안 방식'},
  monthly: {label:'월별 총평균', desc:'매월 평균단가를 계산하고 월말 재고를 다음 달로 이월'}
};
const lsGet=(k,d)=>{ try{ return localStorage.getItem(k)||d; }catch(e){ return d; } };
const lsSet=(k,v)=>{ try{ localStorage.setItem(k,v); }catch(e){} };
let costBasis = BASES[lsGet('jnfam_cost_basis2','full')] ? lsGet('jnfam_cost_basis2','full') : 'full';
let avgMethod = AVGS[lsGet('jnfam_avg_method','period')] ? lsGet('jnfam_avg_method','period') : 'period';
const invCost = r => BASES[costBasis].f(r);
const basisLabel = () => BASES[costBasis].label;
const amtLabel = () => BASES[costBasis].amt;
function setBasis(b){ if(BASES[b]){ costBasis=b; lsSet('jnfam_cost_basis2',b); } render(); }
function setAvg(m){ if(AVGS[m]){ avgMethod=m; lsSet('jnfam_avg_method',m); } render(); }
const r2 = n => Math.round(n*100)/100;
const ymOf = d => dstr(d).slice(0,7);

/* 날짜: 선적일(인식) / 창고입고일 */
const arrD = r => r.invType==='상품' ? (dstr(r.plantEta) || dstr(r.eta) || dstr(r.etd) || BOOK_START) : '';
const shipD = r => { const s = dstr(r.etd) || dstr(r.eta) || ''; const a = arrD(r);
  if(r.invType==='상품') return (!s || (a && s > a)) ? a : s;      // ETD 없거나 입고일보다 늦으면 입고일로
  return s; };                                                       // 미착품: ETD 없으면 미인식
const outD = r => dstr(r.date) || today();
const sameG = g => r => r.item===g.item && +r.purity===+g.purity;
function periodRange(){ const {from,to}=state.period; return {F: (from && from>BOOK_START)? from : BOOK_START, T: to || '9999-12-31'}; }

/* 상품 원가 계산 (그룹별) → {beg, in, out, end, avg, outCost(Map), detail rows} */
function goodsBook(g, F, T){
  const beg0 = state.beginning.filter(sameG(g));
  const b0Q = beg0.reduce((s,b)=>s+(+b.qty||0),0), b0A = beg0.reduce((s,b)=>s+(+b.amt||0),0);
  const arr = state.inbound.filter(r=>sameG(g)(r) && r.invType==='상품' && arrD(r)>=BOOK_START);
  const outs = state.outbound.filter(r=>sameG(g)(r) && r.category!=='충전');
  const outCost = new Map(); const rows=[];
  const sumQ = a => a.reduce((s,r)=>s+(+r.qty||0),0), sumA = a => a.reduce((s,r)=>s+invCost(r),0);
  if(avgMethod==='period'){
    /* 구간 이전 [기초일, F) 를 하나의 총평균으로 이월 → 구간 [F, T] 총평균 */
    const preIn = arr.filter(r=>arrD(r)<F), preOut = outs.filter(r=>outD(r)<F);
    const q0 = b0Q+sumQ(preIn), a0 = b0A+sumA(preIn);
    const avgPre = q0>0 ? a0/q0 : 0;
    let preC=0; preOut.forEach(r=>{ const c=r2((+r.qty||0)*avgPre); outCost.set(r,c); preC+=c; });
    const begQ = q0-sumQ(preOut), begA = a0-preC;
    const ins = arr.filter(r=>arrD(r)>=F && arrD(r)<=T), os = outs.filter(r=>outD(r)>=F && outD(r)<=T);
    const inQ=sumQ(ins), inA=sumA(ins);
    const avg = (begQ+inQ)>0 ? (begA+inA)/(begQ+inQ) : avgPre;
    let outQ=0,outC=0,sales=0; os.forEach(r=>{ const c=r2((+r.qty||0)*avg); outCost.set(r,c); outQ+=(+r.qty||0); outC+=c; sales+=(+r.amount||0); });
    rows.push({month:(F===BOOK_START?'기초':F)+' ~ '+(T==='9999-12-31'?'현재':T), begQ, begA, inQ, inA, avg, outQ, outC, sales, endQ:begQ+inQ-outQ, endA:begA+inA-outC});
    return {begQ,begA,inQ,inA,avg,outQ,outC,sales,endQ:begQ+inQ-outQ,endA:begA+inA-outC,outCost,rows,ins,os};
  }
  /* 월별 총평균: 기초일부터 월 단위로 이월 */
  const byM=new Map(); const slot=m=>{ if(!byM.has(m)) byM.set(m,{ins:[],outs:[]}); return byM.get(m); };
  arr.forEach(r=>slot(ymOf(arrD(r))).ins.push(r)); outs.forEach(r=>slot(ymOf(outD(r))).outs.push(r));
  let q=b0Q, a=b0A, last = q>0? a/q : 0;
  [...byM.keys()].sort().forEach(m=>{
    const {ins,outs:os}=byM.get(m); const inQ=sumQ(ins), inA=sumA(ins); const dq=q+inQ;
    const avg = dq>0 ? (a+inA)/dq : last; last=avg;
    let outQ=0,outC=0,sales=0; os.forEach(r=>{ const c=r2((+r.qty||0)*avg); outCost.set(r,c); outQ+=(+r.qty||0); outC+=c; sales+=(+r.amount||0); });
    rows.push({month:m, begQ:q, begA:a, inQ, inA, avg, outQ, outC, sales, endQ:dq-outQ, endA:a+inA-outC});
    q=dq-outQ; a=a+inA-outC;
  });
  /* 구간 집계: 기초 = 기초재고 + F 이전 입고 − F 이전 출고원가 */
  const preIn = arr.filter(r=>arrD(r)<F), preOut = outs.filter(r=>outD(r)<F);
  const begQ = b0Q+sumQ(preIn)-sumQ(preOut), begA = b0A+sumA(preIn)-preOut.reduce((s,r)=>s+(outCost.get(r)||0),0);
  const ins = arr.filter(r=>arrD(r)>=F && arrD(r)<=T), os = outs.filter(r=>outD(r)>=F && outD(r)<=T);
  const inQ=sumQ(ins), inA=sumA(ins), outQ=sumQ(os), outC=os.reduce((s,r)=>s+(outCost.get(r)||0),0), sales=os.reduce((s,r)=>s+(+r.amount||0),0);
  const endQ=begQ+inQ-outQ, endA=begA+inA-outC;
  const fm=F.slice(0,7), tm=T.slice(0,7);
  const lastRow = rows.filter(x=>x.month<=tm).slice(-1)[0];
  return {begQ,begA,inQ,inA,avg: Math.abs(endQ)>0.5? endA/endQ : (lastRow?lastRow.avg:0),outQ,outC,sales,endQ,endA,outCost,
    rows: rows.filter(x=>x.month>=fm && x.month<=tm), ins, os};
}
/* 출고원가 맵 (출고 탭·엑셀용, 현재 구간·방식 기준) */
function allOutCost(){ const {F,T}=periodRange(); const m=new Map(); itemGroups().forEach(g=>goodsBook(g,F,T).outCost.forEach((v,k)=>m.set(k,v))); return m; }

/* 미착품 수불 (건별 원가) */
function transitBook(g, F, T){
  const recs = state.inbound.filter(r=>sameG(g)(r) && (r.invType==='상품'||r.invType==='미착품') && shipD(r));
  const z=()=>({q:0,a:0,n:0,list:[]}); const beg=z(), ship=z(), arv=z(), end=z();
  const add=(o,r)=>{ o.q+=(+r.qty||0); o.a+=invCost(r); o.n++; o.list.push(r); };
  recs.forEach(r=>{ const s=shipD(r), a=arrD(r);
    if(a && a<BOOK_START) return;                       // 기초 이전 입고 = 기초재고(상품)에 포함
    if(s<F && (!a || a>=F)) add(beg,r);
    if(s>=F && s<=T) add(ship,r);
    if(a && a>=F && a<=T) add(arv,r);
    if(s<=T && (!a || a>T)) add(end,r);
  });
  return {beg,ship,arv,end};
}

function computeLedger(){
  const {F,T}=periodRange();
  return itemGroups().map(g=>{
    const G = goodsBook(g,F,T), Tr = transitBook(g,F,T);
    const ocMap = new Map();
    G.os.forEach(r=>{ const c=outCode(r); const o=ocMap.get(c)||{code:c,qty:0,amt:0,sales:0}; o.qty+=(+r.qty||0); o.amt+=(G.outCost.get(r)||0); o.sales+=(+r.amount||0); ocMap.set(c,o); });
    const inCodes = [...new Set(state.inbound.filter(r=>sameG(g)(r)&&r.invType!=='선적예정(미인식)').map(r=>inCode(r)))];
    const planned = state.inbound.filter(r=>sameG(g)(r) && (r.invType==='선적예정(미인식)' || (r.invType==='미착품' && !shipD(r))));
    return {...g,
      /* 상품 */
      begQty:G.begQ, begAmt:G.begA, inQty:G.inQ, inAmt:G.inA, outQty:G.outQ, outAmt:G.outC, outSales:G.sales,
      goodsQty:G.endQ, goodsAmt:G.endA, avgCost:G.avg, months:G.rows,
      /* 미착품 */
      tBegQty:Tr.beg.q, tBegAmt:Tr.beg.a, tShipQty:Tr.ship.q, tShipAmt:Tr.ship.a, tArrQty:Tr.arv.q, tArrAmt:Tr.arv.a,
      trQty:Tr.end.q, trAmt:Tr.end.a, trCnt:Tr.end.n, trList:Tr.end.list,
      /* 합계 */
      endQty:G.endQ+Tr.end.q, endAmt:G.endA+Tr.end.a,
      outCodes:[...ocMap.values()], inCodes,
      plQty:planned.reduce((s,r)=>s+(+r.qty||0),0), plCnt:planned.length};
  }).filter(l=> l.begQty||l.inQty||l.outQty||l.trQty||l.tBegQty||l.tShipQty||l.plQty||l.begAmt );
}
function ledgerTotals(L){
  const K=['begQty','begAmt','inQty','inAmt','outQty','outAmt','outSales','goodsQty','goodsAmt','tBegQty','tBegAmt','tShipQty','tShipAmt','tArrQty','tArrAmt','trQty','trAmt','trCnt','endQty','endAmt','plQty'];
  return L.reduce((a,l)=>{ K.forEach(k=>a[k]=(a[k]||0)+(l[k]||0)); return a; },{});
}

/* ================= 데이터 점검 (확인 → 비고 → Close) =================
   점검 항목은 건(또는 중복 묶음)별 key로 관리. Close 하면 config/app.checks[key]에 {memo,by,at} 저장 → 목록에서 숨김.
   데이터를 고쳐서 조건이 사라진 항목은 자동으로 없어짐. */
const CHK_CAT = {
  noetd:  {label:'ETD 없는 미착품', act:'선적 완료면 ETD 입력, 아니면 선적예정으로 변경'},
  nofr:   {label:'운임·통관비·관세 미입력 (창고 입고 상품)', act:'포워더 인보이스 확인 후 입력 — 미입력 시 원가가 낮게 잡힘'},
  date:   {label:'ETD가 창고입고일보다 늦음', act:'날짜 확인'},
  dupinv: {label:'같은 품목 INVOICE 번호 중복', act:'오타 또는 중복 등록 확인'},
  dupout: {label:'동일 내용 출고 중복 의심', act:'중복이면 1건 삭제'},
  future: {label:'오늘 이후 날짜 출고', act:'출하 예정이면 출하 후 등록 / 날짜 확인 — 구간 종료일을 비우면 출고된 것으로 계산됨'},
  adj:    {label:'재고조정이 판매로 등록', act:'수량 차감은 맞지만 매출로 집계됨 — 재고조정으로 처리'},
  price:  {label:'판매단가 이상치', act:'금액·수량 확인'}
};
function checkItems(){
  const I=[]; const t=today();
  const add=(cat,kind,recs,desc)=>I.push({key:cat+'_'+recs.map(r=>r.id).sort().join('_'), cat, kind, recs, desc});
  const inDesc = r => `${esc(r.invoice||'-')} · ${esc(r.item)} ${pct(r.purity)} · ${fmt(r.qty)} kg · ETD ${r.etd||'-'} · 입고 ${r.plantEta||'-'}`;
  const outDesc = r => `${esc(r.buyer||'-')} · ${r.date||'-'} · ${esc(r.item)} ${pct(r.purity)} ${esc(r.pack||'')} · ${fmt(r.qty)} kg · $${fmt2(r.amount)}`;
  state.inbound.filter(r=>r.invType==='미착품' && !shipD(r)).forEach(r=>add('noetd','in',[r],inDesc(r)));
  if(costBasis!=='price') state.inbound.filter(r=>r.invType==='상품' && !(+r.freight) && !(+r.cc) && !(+r.duty)).forEach(r=>add('nofr','in',[r],inDesc(r)));
  state.inbound.filter(r=>r.invType==='상품' && dstr(r.etd) && dstr(r.plantEta) && r.etd>r.plantEta).forEach(r=>add('date','in',[r],inDesc(r)));
  const invMap={}; state.inbound.forEach(r=>{ if(!r.invoice) return; const k=r.invoice+'|'+r.item+'|'+r.purity; (invMap[k]=invMap[k]||[]).push(r); });
  Object.values(invMap).filter(a=>a.length>1).forEach(a=>add('dupinv','in',a,`${esc(a[0].invoice)} · ${esc(a[0].item)} ${pct(a[0].purity)} · 입고일 ${a.map(r=>r.plantEta||r.etd||'-').join(', ')}`));
  const og={}; state.outbound.filter(r=>r.category!=='충전' && (+r.qty)>0).forEach(r=>{ const k=[r.item,r.purity,r.pack,r.buyer,r.date,r.qty,r.amount].join('|'); (og[k]=og[k]||[]).push(r); });
  Object.values(og).filter(a=>a.length>1).forEach(a=>add('dupout','out',a,outDesc(a[0])+` × ${a.length}건`));
  state.outbound.filter(r=>r.category!=='충전' && dstr(r.date)>t).forEach(r=>add('future','out',[r],outDesc(r)));
  state.outbound.filter(r=>r.category!=='충전' && /실사|조정/.test(r.buyer||'')).forEach(r=>add('adj','out',[r],outDesc(r)));
  const pg={}; state.outbound.filter(r=>r.category!=='충전' && (+r.qty)>0 && (+r.amount)>0).forEach(r=>{ const k=[r.item,r.purity,r.pack,r.buyer].join('|'); (pg[k]=pg[k]||[]).push(r); });
  Object.values(pg).forEach(a=>{ if(a.length<3) return; const p=a.map(r=>r.amount/r.qty).sort((x,y)=>x-y); const med=p[Math.floor(p.length/2)];
    a.forEach(r=>{ const u=r.amount/r.qty; if(u>med*2||u<med/2) add('price','out',[r],outDesc(r)+` · $${u.toFixed(2)}/kg (보통 $${med.toFixed(2)})`); }); });
  const C=state.checks||{};
  I.forEach(it=>{ it.closed=C[it.key]||null; });
  return I;
}

function dataChecks(){

async function saveChecks(patch){
  state.checks = Object.assign({}, state.checks||{}, patch);
  Object.keys(patch).forEach(k=>{ if(patch[k]===null) delete state.checks[k]; });
  if(fb){
    const v={}; Object.entries(patch).forEach(([k,x])=>v[k]= x===null ? fb.deleteField() : x);
    await fb.setDoc(fb.doc(fb.db,'config','app'), {checks:v}, {merge:true});
  } else { localSave(); }
  render();
}
async function closeCheck(key){
  const el=document.getElementById('chkm_'+key); const memo=(el&&el.value||'').trim();

  const it=checkItems().find(i=>i.key===key);
  const by = currentUser ? (currentUser.displayName||currentUser.email||'') : '로컬';
  await saveChecks({[key]:{memo, by, at:Date.now(), cat:it?it.cat:'', desc:it?it.desc.replace(/<[^>]+>/g,''):''}});
  if(state.chkDraft) delete state.chkDraft[key];

  if(it) logHistory({action:'점검 종료', kind:'cfg', col:'config', docId:'app', summary:`${CHK_CAT[it.cat].label} · ${it.desc.replace(/<[^>]+>/g,'')}`, changes:[{f:'memo',label:'비고',from:'',to:memo}]});
}

/* 점검 목록 엑셀 (미종료 + 종료 모두, 상태·비고 포함) */
function exportChecks(){
  const all=checkItems(); if(!all.length){ toast('점검 항목이 없습니다'); return; }
  const R=[]; all.forEach(i=>i.recs.forEach(r=>R.push({
    상태:i.closed?'종료':'확인 필요', 점검항목:CHK_CAT[i.cat].label, 구분:i.kind==='in'?'입고':'출고',
    'INVOICE / 판매처':i.kind==='in'?(r.invoice||''):(r.buyer||''), 품목:r.item+' '+pct(r.purity),
    ETD:i.kind==='in'?(r.etd||''):'', 창고입고일:i.kind==='in'?(r.plantEta||''):'', 출고일:i.kind==='out'?(r.date||''):'',
    '수량(kg)':+r.qty||0, '금액(USD)':+r.amount||0, 조치:CHK_CAT[i.cat].act,
    비고:i.closed?i.closed.memo:'', 종료자:i.closed?(i.closed.by||''):'', 종료일시:i.closed&&i.closed.at?absTime(i.closed.at):''})));
  const sum={}; all.forEach(i=>{ const s=sum[i.cat]||(sum[i.cat]={점검항목:CHK_CAT[i.cat].label,'확인 필요':0,종료:0}); i.closed?s.종료++:s['확인 필요']++; });
  const wb=XLSX.utils.book_new();
  const ws1=XLSX.utils.json_to_sheet([...Object.values(sum)]); ws1['!cols']=[{wch:34},{wch:10},{wch:8}];
  const ws2=XLSX.utils.json_to_sheet(R); ws2['!cols']=[{wch:9},{wch:30},{wch:6},{wch:18},{wch:13},{wch:11},{wch:11},{wch:11},{wch:10},{wch:12},{wch:40},{wch:30},{wch:14},{wch:16}];
  XLSX.utils.book_append_sheet(wb,ws1,'요약'); XLSX.utils.book_append_sheet(wb,ws2,'점검상세');
  XLSX.writeFile(wb,'JNFAM_수불부_데이터점검_'+today()+'.xlsx');
}

const trKey = r => `${r.item}|${+r.purity||0}`;
const trKeyLabel = k => { const [i,p]=k.split('|'); return `${i} ${pct(p)}`; };
function trPeriod(kind){
  const f=state.filters.tr, d=new Date(), y=d.getFullYear(), m=d.getMonth();
  const ds=x=>`${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`;
  if(kind==='thisM'){ f.from=ds(new Date(y,m,1)); f.to=ds(new Date(y,m+1,0)); }
  else if(kind==='lastM'){ f.from=ds(new Date(y,m-1,1)); f.to=ds(new Date(y,m,0)); }
  else if(kind==='3M'){ f.from=ds(new Date(y,m-2,1)); f.to=ds(new Date(y,m+1,0)); }
  else if(kind==='year'){ f.from=`${y}-01-01`; f.to=`${y}-12-31`; }
  else { f.from=''; f.to=''; }
  render();
}

/* ---------- 수불부 (Inventory Ledger 원본 양식) ---------- */
function renderLedger(){
  const L=computeLedger(); const t=ledgerTotals(L); const {T}=periodRange();
  const asOf = T==='9999-12-31' ? '현재' : T;
  const grpClass = item => 'grp-'+item.replace(/[^A-Za-z0-9]/g,'');
  const nz = (v,f) => v? f(v) : '-';
  /* 상품 수불부 */
  const goodsRows = L.map(l=>{
    const ocs = l.outCodes.length? l.outCodes : [{code:'-',qty:null,amt:null}];
    const n = ocs.length; const gc = grpClass(l.item);
    return ocs.map((oc,i)=>`<tr>
      ${i===0?`<td class="center ${gc}" rowspan="${n}" style="font-weight:700">${esc(l.item)}<br><span style="font-weight:400;font-size:11px">${pct(l.purity)}</span></td>
      <td class="center ${gc}" rowspan="${n}"><span class="mono">${l.inCodes.filter(c=>c.startsWith('04')).map(esc).join('<br>')||'-'}</span></td>`:''}
      <td><span class="mono">${esc(oc.code)}</span></td>
      ${i===0?`<td class="num center" rowspan="${n}">${fmt(l.begQty)}</td><td class="num center" rowspan="${n}">${fmt2(l.begAmt)}</td>
      <td class="num center" rowspan="${n}">${fmt(l.inQty)}</td><td class="num center" rowspan="${n}">${fmt2(l.inAmt)}</td>`:''}
      <td class="num">${oc.qty==null?'-':fmt(oc.qty)}</td><td class="num" title="${oc.sales!=null?'매출 $'+fmt2(oc.sales):''}">${oc.amt==null?'-':fmt2(oc.amt)}</td>
      ${i===0?`<td class="num center" rowspan="${n}" style="font-weight:700">${fmt(l.goodsQty)}</td>
      <td class="num center ${l.goodsAmt<0?'neg':''}" rowspan="${n}" style="font-weight:700">${fmt2(l.goodsAmt)}</td>
      <td class="num center" rowspan="${n}" style="color:var(--blue);font-weight:700">${l.avgCost?l.avgCost.toFixed(4):'-'}</td>
      <td class="center" rowspan="${n}">${Math.abs(l.begQty+l.inQty-l.outQty-l.goodsQty)<0.01? '<span class="tag ok">일치</span>':'<span class="tag warn">확인</span>'}</td>`:''}
    </tr>`).join('');
  }).join('');
  /* 미착품 수불부 */
  const trRows = L.map(l=>`<tr><td class="${grpClass(l.item)}" style="font-weight:700">${esc(l.label)}</td>
    <td class="num">${nz(l.tBegQty,fmt)}</td><td class="num">${nz(l.tBegAmt,fmt2)}</td>
    <td class="num">${nz(l.tShipQty,fmt)}</td><td class="num">${nz(l.tShipAmt,fmt2)}</td>

    <td class="center">${l.trCnt||'-'}</td>
    <td class="center">${Math.abs(l.tBegQty+l.tShipQty-l.tArrQty-l.trQty)<0.01?'<span class="tag ok">일치</span>':'<span class="tag warn">확인</span>'}</td></tr>`).join('');

    <td class="num">${fmt(l.goodsQty)}</td><td class="num">${fmt2(l.goodsAmt)}</td>

  <div class="panel">
    <div class="ledger-title">① 상품 수불부 (04 · 창고)</div>

    <div class="toolbar" style="margin-bottom:10px"><span class="help">기초 + 창고입고 − 출고 = 기말 · 출고·기말 금액 = 수량 × 평균단가</span><span class="spacer"></span><button class="btn ghost sm" onclick="app.exportExcel()">📄 엑셀 내보내기</button></div>
    <div class="tbl-scroll"><table class="ledger-tbl"><thead>
      <tr><th rowspan="2">Product<br>Name</th><th rowspan="2">Inbound Code</th><th rowspan="2">Outbound Code</th>

function syncPurity(){
  const M=state.master||SEED.master;
  const it=$('f_item').value; const ps=M.items.find(x=>x.name===it)?.purities||[];

function calcIn(fromPrice){
  const qty=+$('f_qty').value||0, price=+$('f_price').value||0;
  if(fromPrice && qty && price) $('f_amount').value=(qty*price).toFixed(2);
  const amount=+$('f_amount').value||0;
  if(qty && amount && !price) $('f_price').value=(amount/qty).toFixed(4);
  const r={invType:$('f_invType').value,item:$('f_item').value,purity:+$('f_purity').value,supplier:$('f_supplier').value,pack:$('f_pack').value,
    freight:+$('f_freight').value||0,cc:+$('f_cc').value||0,duty:+$('f_duty').value||0,trucking:+$('f_trucking').value||0,etc:+$('f_etc').value||0,amount};
  const cp=$('codePreview'); cp.textContent=inCode(r); cp.className='code-preview'+(r.invType==='미착품'?' transit':'');
  $('calcBox').innerHTML=`<span>금액: <b>$${fmt2(amount)}</b></span><span>총계(운임+통관+관세): <b>$${fmt2(capCost(r))}</b></span><span>원재료인식금액: <b style="color:var(--blue)">$${fmt2(cogc(r))}</b></span><span style="color:var(--sub)">운송비·기타: $${fmt2((+r.trucking||0)+(+r.etc||0))}</span>`;

function syncPurityOut(){

/* 신규 출고: 같은 품목·함량·판매처의 최근 단가를 기본값으로 */
function prefillPrice(){
  const el=$('o_price'); if(el.dataset.touched) return;
  const it=$('o_item').value, pu=+$('o_purity').value, by=$('o_buyer').value;
  const last=[...state.outbound].filter(r=>r.item===it&&+r.purity===+pu&&r.buyer===by&&+r.qty>0&&+r.amount>0)
    .sort((a,b)=>dstr(b.date).localeCompare(dstr(a.date)))[0];
  el.value = last ? (last.price!=null&&last.price!=='' ? last.price : +(last.amount/last.qty).toFixed(4)) : '';
}
function calcOut(){
  const r={item:$('o_item').value,purity:+$('o_purity').value,pack:$('o_pack').value,buyer:$('o_buyer').value};
  $('codePreviewOut').textContent = $('o_category').value==='충전' ? '(충전 — 수불 제외)' : outCode(r);
  if(document.activeElement && document.activeElement.id==='o_price') $('o_price').dataset.touched='1';
  const q=+$('o_qty').value||0, pr=+$('o_price').value||0;
  const a = q>0 ? Math.round(q*pr*100)/100 : 0;   // 음수(실계근량 차이 등)는 금액 0
  $('o_amount').value = (q||pr) ? a.toFixed(2) : '';
  const led=computeLedger().find(l=>l.item===r.item&&+l.purity===+r.purity);
  const stock=led?led.goodsQty:0;
  $('calcBoxOut').innerHTML=`<span>금액: <b>${q>0&&pr? '$'+fmt2(a) : q<0? '$0.00 (음수 수량)' : '-'}</b></span><span>현재 상품재고: <b>${fmt(stock)} kg</b></span><span>출고 후: <b style="color:${stock-q<0?'var(--red)':'var(--green)'}">${fmt(stock-q)} kg</b></span>`;
}
async function saveOutbound(id){
  const rec={category:$('o_category').value,item:$('o_item').value,purity:+$('o_purity').value,pack:$('o_pack').value,buyer:$('o_buyer').value,
    date:$('o_date').value,qty:+$('o_qty').value||0,price:+$('o_price').value||0,amount:+$('o_amount').value||0,shuttle:+$('o_shuttle').value||0,
    note:$('o_note').value,inCode:''};
  if(!rec.qty||!rec.date){ toast('출고일과 수량을 입력하세요'); return; }
  if(rec.category!=='충전'){
    const led=computeLedger().find(l=>l.item===rec.item&&+l.purity===+rec.purity);
    const cur=(led?led.goodsQty:0)+(id? (+state.outbound.find(x=>x.id===id)?.qty||0):0);
    if(rec.qty>cur && !confirm(`현재 상품재고(${fmt(cur)} kg)보다 많은 수량입니다. 계속할까요?`)) return;
  }
  if(id) await dbUpdate('outbound',id,rec,'출고 수정'); else await dbAdd('outbound',{id:uid('out'),...rec},'출고 등록');
  closeModal(); toast(id?'출고 수정 완료':'출고 등록 완료 — 코드: '+outCode(rec));
}

  <div class="banner" style="margin-top:10px">💡 창고 입고는 <b>재고 현황 시스템 › 입고 예정 › 입고 등록</b>에서 하면 Lot 등록과 수불부 전환이 한 번에 됩니다. 여기서 전환하면 재고 현황에서 <b>Lot을 따로 등록</b>해야 합니다 (재고 현황 대시보드에 “Lot 미등록”으로 표시).</div>
  <div class="modal-actions">
    <button class="btn ghost" onclick="app.closeModal()">취소</button>
    <button class="btn green" onclick="app.doConvert('${id}')">✓ 상품 전환 확정</button>
  </div>`);
}
async function doConvert(id){
  const r=state.inbound.find(x=>x.id===id); if(!r) return;
  const d=$('cv_date').value; if(!d){ toast('창고입고일을 입력하세요'); return; }
  const patch={invType:'상품',plantEta:d,
    convert:{prevCode:inCode(r),date:today(),note:$('cv_note').value},
    note:(r.note?r.note+' / ':'')+'미착품 전환 '+today()};
  await dbUpdate('inbound',id,patch,'입고완료(05→04)');
  closeModal(); toast(`상품 전환 완료: ${inCode({...r,invType:'상품'})}`);
}
function shipModal(id){
  const r=state.inbound.find(x=>x.id===id); if(!r) return;
  if(!confirm(`FOB 선적 완료 처리하시겠습니까?\n${inCode(r)} → ${inCode({...r,invType:'미착품'})}`)) return;
  dbUpdate('inbound',id,{invType:'미착품',convertShip:{prevCode:inCode(r),date:today()}},'선적완료(00→05)');
  toast('미착품(05)으로 전환되었습니다');
}

/* ---------- 기타 액션 ---------- */
function applyPeriod(){ state.period={from:$('pFrom').value,to:$('pTo').value}; render(); }
function quickPeriod(f,t){ state.period={from:f,to:t}; render(); }
function chartMode(m){ state.chartMode=m; render(); }
async function loadSeed(){
  if(state.inbound.length && !confirm('이미 데이터가 있습니다. 기존 엑셀 데이터를 추가로 불러올까요? (중복될 수 있음)')) return;
  if(fb){ await seedToFirebase(); logHistory({action:'엑셀 데이터 불러오기', kind:'add', col:'', summary:`입고 ${SEED.inbound.length} · 출고 ${SEED.outbound.length}건 일괄 업로드`}); }
  else{
    state.inbound=[...state.inbound,...SEED.inbound.map(r=>({...r}))];
    state.outbound=[...state.outbound,...SEED.outbound.map(r=>({...r}))];
    if(!state.beginning.length) state.beginning=SEED.beginning.map(b=>({...b}));
    state.master=state.master||SEED.master;
    localSave(); render(); toast('기존 엑셀 데이터 불러오기 완료');
  }
}
async function del(col,id){
  const r=col==='outbound'?state.outbound.find(x=>x.id===id):null;
  const msg=r&&r.src==='inventory'
    ? '재고 현황 시스템의 출하와 연동된 출고입니다.\n여기서 삭제하면 재고 현황의 출하 기록(Lot 차감)은 그대로 남습니다.\n출하 자체를 취소하려면 재고 현황에서 출하 기록을 삭제하세요 (수불부도 자동 삭제).\n\n그래도 수불부에서만 삭제할까요?'
    : '삭제하시겠습니까?';
  if(confirm(msg)) await dbDelete(col,id,COL_LABEL[col]+' 삭제');
}
function setFilter(k,field,v){
  state.filters[k][field]=v;
  const ae=document.activeElement, id=ae&&ae.id, pos=ae&&ae.selectionStart;
  render();
  if(id){ const el=$(id); if(el){ el.focus(); try{ el.setSelectionRange(pos,pos); }catch(e){} } }
}
function resetFilter(k){
  state.filters[k] = k==='in' ? {type:'전체',item:'',supplier:'',q:'',from:'',to:''} : k==='tr' ? {item:'',basis:state.filters.tr.basis||'etd',from:'',to:''} : {cat:'전체',item:'',buyer:'',q:'',from:'',to:''};
  render();
}
async function setBegNote(i,v){ const b=state.beginning[i]; if((b.note||'')===v) return; b.note=v; await saveConfigDoc(); toast('기초재고 근거 저장됨'); }
async function setBeg(i,k,v){
  const b=state.beginning[i]; const old=b[k]; b[k]=+v||0; await saveConfigDoc(); toast('기초재고 저장됨');
  if((+old||0)!==b[k]) logHistory({action:'기초재고 수정', kind:'cfg', col:'config', docId:'app', summary:`${b.item} ${pct(b.purity)}`,
    changes:[{f:k,label:k==='qty'?'기초수량':'기초금액',from:k==='qty'?fmt(old):fmt2(old),to:k==='qty'?fmt(b[k]):fmt2(b[k])}]});
}
async function addBuyer(){
  const b=$('newBuyer').value.trim(); if(!b) return;
  state.master=state.master||JSON.parse(JSON.stringify(SEED.master));
  if(!state.master.buyers.includes(b)) state.master.buyers.push(b);
  await saveConfigDoc(); toast('판매처 추가: '+b); render();
  logHistory({action:'판매처 추가', kind:'cfg', col:'config', docId:'app', summary:b});
}
async function connect(){
  let cfg; const raw=$('fbCfg').value.trim();
  try{ cfg = JSON.parse(raw.replace(/(\w+)\s*:/g,'"$1":').replace(/'/g,'"').replace(/,\s*}/g,'}')); }
  catch(e){ try{ cfg=JSON.parse(raw); }catch(e2){ toast('config 형식이 올바르지 않습니다. JSON을 확인하세요.'); return; } }
  await connectFirebase(cfg);
}
async function disconnect(){ await logout(); localStorage.removeItem(CFGKEY); location.reload(); }
function backup(){
  const blob=new Blob([JSON.stringify({inbound:state.inbound,outbound:state.outbound,beginning:state.beginning,master:state.master},null,1)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='JNFAM_수불부_백업_'+today()+'.json'; a.click();
}
async function wipe(){
  if(!confirm('모든 데이터를 삭제합니다. 계속할까요?')) return;
  if(fb){
    for(const col of ['inbound','outbound']){
      const snap=await fb.getDocs(fb.collection(fb.db,col));
      const batch=fb.writeBatch(fb.db); snap.docs.forEach(d=>batch.delete(d.ref)); await batch.commit();
    }
  } else { state.inbound=[];state.outbound=[];localSave(); render(); }
  toast('전체 데이터 삭제 완료');
  logHistory({action:'전체 데이터 삭제', kind:'del', col:'', summary:'입고·출고 전체 삭제'});
}
/* 월별 총평균 계산 내역 */
function avgPanel(L){
  const rows = L.filter(l=>l.months.length).map(l=>l.months.map((m,i)=>`<tr>
    ${i===0?`<td rowspan="${l.months.length}" style="font-weight:700;vertical-align:middle">${esc(l.label)}</td>`:''}
    <td class="mono">${m.month}</td>
    <td class="num">${fmt(m.begQ)}</td><td class="num">${fmt2(m.begA)}</td>
    <td class="num">${fmt(m.inQ)}</td><td class="num">${fmt2(m.inA)}</td>
    <td class="num" style="font-weight:700;color:var(--blue)">${m.avg.toFixed(4)}</td>
    <td class="num">${fmt(m.outQ)}</td><td class="num">${fmt2(m.outC)}</td>
    <td class="num ${m.endQ<0?'neg':''}">${fmt(m.endQ)}</td><td class="num ${m.endA<0?'neg':''}">${fmt2(m.endA)}</td>
    <td class="num" style="color:var(--sub)">${fmt2(m.sales)}</td></tr>`).join('')).join('');
  return `<div class="panel"><h3>평균단가 계산 내역 — ${AVGS[avgMethod].label} (상품 04 · ${basisLabel()} · ${periodLabel()})</h3>
  <div class="help" style="margin-bottom:8px">${avgMethod==='period'
    ? '평균단가 = (구간 기초금액 + 구간 창고입고 '+amtLabel()+') ÷ (구간 기초수량 + 구간 입고수량) · 출고원가·기말금액 = 수량 × 평균단가 · 구간 시작일 이전 실적은 같은 방식으로 이월'
    : '월 평균단가 = (월초 금액 + 당월 입고 '+amtLabel()+') ÷ (월초 수량 + 당월 입고 수량) · 출고원가 = 출고 수량 × 월 평균단가 · 월말 재고가 다음 달 월초로 이월'}</div>
  <div class="tbl-scroll"><table><thead><tr><th>품목</th><th>${avgMethod==='period'?'구간':'월'}</th><th class="num">기초 수량</th><th class="num">기초 금액($)</th><th class="num">입고 수량</th><th class="num">입고 금액($)</th>
  <th class="num">총평균단가</th><th class="num">출고 수량</th><th class="num">출고원가($)</th><th class="num">기말 수량</th><th class="num">기말 금액($)</th><th class="num">매출(참고)</th></tr></thead>
  <tbody>${rows||'<tr><td colspan="12" class="empty">해당 구간에 상품 입출고가 없습니다</td></tr>'}</tbody></table></div></div>`;
}

function exportExcel(){
  const wb=XLSX.utils.book_new(); const {T}=periodRange(); const asOf=T==='9999-12-31'?today():T;
  const clsAt = r => { if(r.invType==='선적예정(미인식)') return '선적예정'; const s=shipD(r), a=arrD(r);
    if(!s) return '미인식(ETD 없음)'; if(a && a<=asOf) return '상품'; if(s<=asOf) return '미착품'; return '미선적'; };
  const inRows=state.inbound.map(r=>({재고구분:r.invType,[asOf+' 기준 구분']:clsAt(r),코드:inCode(r),품목:r.item,함량:pct(r.purity),구매처:r.supplier,용기:r.pack,ETD:r.etd,ETA:r.eta,창고입고일:r.plantEta,'BL No.':r.bl,'INVOICE No.':r.invoice,'수량(kg)':r.qty,'단가':r.price,'금액(USD)':r.amount,해상운송료:r.freight,통관비:r.cc,관세:r.duty,운송비:r.trucking,기타비용:r.etc,'총계(운임·통관·관세)':capCost(r),'원재료인식금액(운송·기타 포함)':r2(BASES.full.f(r)),['재고원가('+basisLabel()+')']:r2(invCost(r)),비고:r.note}));
  const OC=allOutCost();
  const outRows=state.outbound.map(r=>({구분:r.category,출고코드:r.category==='충전'?'':outCode(r),품목:r.item,함량:pct(r.purity),용기:r.pack,판매처:r.buyer,출고일:r.date,'출고수량(kg)':r.qty,'판매단가($/kg)':r.qty?+(r.amount/r.qty).toFixed(4):'','출고금액(매출 USD)':r.amount,'출고원가':r.category==='충전'?'':(OC.has(r)?OC.get(r):''),'Shuttle':r.shuttle,비고:r.note}));
  const L=computeLedger(); const t=ledgerTotals(L);
  const gRows=[];
  L.forEach(l=>{ const ocs=l.outCodes.length?l.outCodes:[{code:'-',qty:'',amt:'',sales:''}];
    ocs.forEach((oc,i)=>gRows.push({'Product':i===0?l.label:'','Outbound Code':oc.code,
      '기초수량':i===0?l.begQty:'','기초금액':i===0?r2(l.begAmt):'','창고입고수량':i===0?l.inQty:'','창고입고금액':i===0?r2(l.inAmt):'',
      '출고수량':oc.qty,'출고원가':oc.amt===''?'':r2(oc.amt),'매출(참고)':oc.sales===''?'':r2(oc.sales),
      '기말수량':i===0?l.goodsQty:'','기말금액':i===0?r2(l.goodsAmt):'','평균단가':i===0?+l.avgCost.toFixed(4):''})); });
  gRows.push({'Product':'합계','기초수량':t.begQty,'기초금액':r2(t.begAmt),'창고입고수량':t.inQty,'창고입고금액':r2(t.inAmt),'출고수량':t.outQty,'출고원가':r2(t.outAmt),'매출(참고)':r2(t.outSales),'기말수량':t.goodsQty,'기말금액':r2(t.goodsAmt)});
  const tRows=L.map(l=>({'Product':l.label,'기초수량':l.tBegQty,'기초금액':r2(l.tBegAmt),'선적수량':l.tShipQty,'선적금액':r2(l.tShipAmt),'창고입고수량':l.tArrQty,'창고입고금액':r2(l.tArrAmt),'기말수량':l.trQty,'기말금액':r2(l.trAmt),'건수':l.trCnt}));
  tRows.push({'Product':'합계','기초수량':t.tBegQty,'기초금액':r2(t.tBegAmt),'선적수량':t.tShipQty,'선적금액':r2(t.tShipAmt),'창고입고수량':t.tArrQty,'창고입고금액':r2(t.tArrAmt),'기말수량':t.trQty,'기말금액':r2(t.trAmt),'건수':t.trCnt});
  const sRows=L.map(l=>({'Product':l.label,'상품수량':l.goodsQty,'상품금액':r2(l.goodsAmt),'미착품수량':l.trQty,'미착품금액':r2(l.trAmt),'합계수량':l.endQty,'합계금액':r2(l.endAmt)}));
  sRows.push({'Product':'합계','상품수량':t.goodsQty,'상품금액':r2(t.goodsAmt),'미착품수량':t.trQty,'미착품금액':r2(t.trAmt),'합계수량':t.endQty,'합계금액':r2(t.endAmt)});
  const avgRows=[]; L.forEach(l=>l.months.forEach(m=>avgRows.push({품목:l.label,[avgMethod==='period'?'구간':'월']:m.month,'기초수량':m.begQ,'기초금액':r2(m.begA),'입고수량':m.inQ,'입고금액':r2(m.inA),'평균단가':+m.avg.toFixed(6),'출고수량':m.outQ,'출고원가':r2(m.outC),'기말수량':m.endQ,'기말금액':r2(m.endA),'매출(참고)':r2(m.sales)})));
  const trList=L.flatMap(l=>l.trList.map(r=>({품목:l.label,'INVOICE No.':r.invoice,ETD:shipD(r),창고입고일:arrD(r)||'',현재구분:r.invType,'수량(kg)':r.qty,['금액('+amtLabel()+')']:r2(invCost(r))})));
  const info=[{항목:'기준일',내용:asOf},{항목:'조회 구간',내용:periodLabel()},{항목:'원가 기준',내용:basisLabel()+' — '+BASES[costBasis].desc},{항목:'평균 방식',내용:AVGS[avgMethod].label+' — '+AVGS[avgMethod].desc},{항목:'분류 기준',내용:'ETD ≤ 기준일 < 창고입고일 = 미착품, 창고입고일 ≤ 기준일 = 상품'},
    ...dataChecks().map((w,i)=>({항목:'점검 '+(i+1),내용:w.replace(/<[^>]+>/g,'')}))];
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(info),'기준·점검');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(sRows),'재고합계');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(gRows),'상품수불부');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(tRows),'미착품수불부');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(trList.length?trList:[{품목:'미착품 없음'}]),'기말미착품');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(avgRows),'평균단가');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(inRows),'상품입고');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(outRows),'상품출고');
  XLSX.writeFile(wb,'JNFAM_수불부_'+asOf+'_'+({full:'회계기준',landed:'운임포함',price:'구매단가'})[costBasis]+'_'+AVGS[avgMethod].label.replace(/\s/g,'')+'.xlsx');
}

window.app = {chkDraft,closeCheck,reopenCheck,chkShowClosed,exportChecks,setBasis,setAvg,chkToggle,setBegNote,trPeriod,inboundModal,outboundModal,convertModal,shipModal,doConvert,saveInbound,saveOutbound,closeModal,
  syncPurity,syncPurityOut,calcIn,calcOut,del,setFilter,resetFilter,setBeg,addBuyer,
  applyPeriod,quickPeriod,chartMode,
  loadSeed,connect,disconnect,backup,wipe,exportExcel,googleLogin,logout,
  goView,setHistFilter,resetHistFilter,toggleHist,exportHistory};

(async function init(){
  const had = localLoad(); localHistLoad();
  if(!state.master) state.master=SEED.master;
  const cfgRaw = localStorage.getItem(CFGKEY);
  let ok=false;
  if(cfgRaw){ try{ ok = await connectFirebase(JSON.parse(cfgRaw), true); }catch(e){} }
  if(!ok && DEFAULT_FB && DEFAULT_FB.projectId){ try{ ok = await connectFirebase(DEFAULT_FB, true); }catch(e){} }
  if(!ok) setConn('off','로컬 모드 (Firebase 연결 실패)');
  if(!ok && !had){
    state.inbound=SEED.inbound.map(r=>({...r}));
    state.outbound=SEED.outbound.map(r=>({...r}));
    state.beginning=SEED.beginning.map(b=>({...b}));
    state.master=SEED.master; localSave();
  }
  render();
})();
